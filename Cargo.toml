[package]
name = "tiiny-gauge"
version = "0.1.0"
edition = "2024"
publish = false
description = "A 128×64 OLED dashboard for Tiiny Pocket, built with Rust and Embassy on Pico W."

[[bin]]
name = "tiiny-gauge"
path = "src/main.rs"
test = false
bench = false

[dependencies]
cortex-m-rt = "0.7"
cyw43 = "0.7"
cyw43-firmware = { version = "0.1", default-features = false, features = ["wifi"] }
cyw43-pio = "0.10"
display-interface = "0.5"
embassy-executor = { version = "0.10", features = ["executor-thread", "platform-cortex-m"] }
embassy-futures = "0.1"
embassy-net = { version = "0.9", features = ["dhcpv4", "dns", "medium-ethernet", "tcp"] }
embassy-rp = { version = "0.10", features = ["critical-section-impl", "rp2040", "time-driver"] }
embassy-time = "0.5"
embedded-hal-bus = { version = "0.3", optional = true, features = ["async"] }
panic-halt = "1"
portable-atomic = { version = "1", features = ["critical-section"] }
reqwless = { version = "0.14", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
serde-json-core = "0.6"
ssd1306 = { version = "0.10", default-features = false, features = ["async"] }
static_cell = "2"

[features]
oled-spi = ["dep:embedded-hal-bus"]
oled-sh1106 = []

[profile.release]
lto = true
opt-level = "s"
