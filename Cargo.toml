[package]
name = "tiiny-gauge"
version = "0.1.0"
edition = "2024"
publish = false
description = "A 128×64 OLED dashboard for Tiiny Pocket, built with Rust and Embassy on Pico W."

[[bin]]
name = "tiiny-gauge"
path = "src/main.rs"
test = false
bench = false

[dependencies]
cortex-m-rt = "0.7"
embassy-executor = { version = "0.10", features = ["executor-thread", "platform-cortex-m"] }
embassy-rp = { version = "0.10", features = ["critical-section-impl", "rp2040", "time-driver"] }
embassy-time = "0.5"
panic-halt = "1"
ssd1306 = { version = "0.10", default-features = false, features = ["async"] }

[profile.release]
lto = true
opt-level = "s"
